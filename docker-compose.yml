services:

  # 1. ZOOKEEPER — Kafka cluster coordinator
  # Kafka uses Zookeeper to track active brokers,
  # manage leader election for each partition,
  # and store cluster configuration.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 2. KAFKA — Message Broker
  # The scraper publishes events when new data is downloaded (producer).
  # The pipeline_consumer receives events and triggers the pipeline (consumer).
  # Messages are retained for 7 days to allow replay after a crash.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168

  # 3. DATA LAKE — MinIO (S3 Compatible)
  # Stores data across three layers (medallion architecture):
  #   /bronze/ → raw CSV files as received from sources
  #   /silver/ → cleaned data in Parquet format
  #   /gold/   → aggregated metrics ready for the dashboard
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API — used by Spark and the Python client
      - "9001:9001"   # Web Console — http://localhost:9001
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  # 4. SERVING LAYER — PostgreSQL
  # Receives aggregated Gold layer data.
  # The Streamlit dashboard reads directly from here.
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=bdt_admin
      - POSTGRES_PASSWORD=bdt_password
      - POSTGRES_DB=rental_observatory
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 5. PROCESSING ENGINE — JupyterLab with PySpark
  # Kept for interactive development and debugging.
  # Notebooks allow exploring data and testing transformations manually.
  pyspark:
    image: jupyter/pyspark-notebook:latest
    container_name: pyspark
    ports:
      - "8888:8888"   # JupyterLab — http://localhost:8888 (token: bigdata123)
      - "4040:4040"   # Spark UI  — http://localhost:4040
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=bigdata123
    volumes:
      - .:/home/jovyan/work
      - ./spark_jars:/tmp/spark_jars
    depends_on:
      - minio
      - postgres

  # 6. PIPELINE RUNNER — Automated pipeline with Kafka
  # Runs two components in parallel via pipeline/start.py:
  #
  #   scraper.py
  #     Every CHECK_INTERVAL_HOURS, checks for updated data online.
  #     If new data is found, downloads files to data/raw/ and
  #     publishes a Kafka event to trigger the pipeline.
  #
  #   pipeline_consumer.py
  #     Listens on the Kafka topic "pipeline.file-events".
  #     Applies a 60s debounce, then runs run_pipeline.py:
  #       → ingestion.py  (CSV → MinIO Bronze)
  #       → processing.py (Bronze → Silver → Gold via Spark)
  #       → serving.py    (Gold → PostgreSQL)
  #
  # Uses the same PySpark image as the notebook container
  # so Spark is available during the processing step.
  # PYTHONPATH includes the Spark Python directory because in this image
  # PySpark is not installed as a pip package in the conda base —
  # it lives under /usr/local/spark-*/python/ instead.
  pipeline-runner:
    image: jupyter/pyspark-notebook:latest
    container_name: pipeline-runner
    user: root
    working_dir: /app
    volumes:
      - .:/app
      - ./spark_jars:/tmp/spark_jars
    environment:
      - MINIO_HOST=minio:9000
      - MINIO_USER=admin
      - MINIO_PASS=password123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rental_observatory
      - POSTGRES_USER=bdt_admin
      - POSTGRES_PASS=bdt_password
      - KAFKA_BROKER=kafka:9092
      - DATA_RAW_PATH=/app/data/raw
      - CHECK_INTERVAL_HOURS=24
      - PYTHONPATH=/app:/usr/local/spark-3.5.0-bin-hadoop3/python:/usr/local/spark-3.5.0-bin-hadoop3/python/lib/py4j-0.10.9.7-src.zip
      - SPARK_HOME=/usr/local/spark-3.5.0-bin-hadoop3
      - PYSPARK_PYTHON=/opt/conda/bin/python
    command: >-
      bash -c "/opt/conda/bin/pip install kafka-python watchdog minio apache-sedona geopandas shapely beautifulsoup4 lxml requests --quiet &&
      echo 'Dependencies installed' &&
      /opt/conda/bin/python /app/pipeline/start.py"
    depends_on:
      - kafka
      - minio
      - postgres

  # 7. FRONTEND — Streamlit Dashboard
  # Interactive dashboard reading from PostgreSQL.
  # Auto-refreshes every 5 minutes via cache TTL.
  frontend:
    image: python:3.9-slim
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    working_dir: /app
    command: >-
      bash -c "pip install streamlit psycopg2-binary pandas plotly requests --quiet &&
      streamlit run dashboard.py --server.address=0.0.0.0"
    depends_on:
      - postgres

volumes:
  pgdata: